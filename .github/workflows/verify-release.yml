name: verify-release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versão a verificar (ex: 0.2.0)"
        required: true
  schedule:
    # Todo dia às 12:00 UTC confere a última release nos quatro canais.
    - cron: "0 12 * * *"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Resolver versão
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            TAG=$(curl -fsSL -A "verify-release" \
              "https://api.github.com/repos/${{ github.repository }}/releases/latest" \
              | jq -r '.tag_name')
            echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Verificar GitHub Release, crates.io, AUR e Homebrew
        run: ./scripts/verify-release.sh "${{ steps.version.outputs.version }}"
